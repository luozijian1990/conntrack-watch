name: eBPF egress
on:
  push:
    branches: [ebpf]
  pull_request:
    branches: [ebpf]
jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: make test
      - run: make build GOARCH=amd64
      - run: make build GOARCH=arm64
      - run: go vet ./...
      - run: python3 scripts/check-dashboard.py
      - uses: actions/upload-artifact@v4
        with:
          name: egress-bpf-object
          path: build/egress.bpf.o
