# Replace source_cidrs and exclude_cidrs with your cluster's real ranges.
ports: [80, 443]
source_cidrs: ["10.244.0.0/16"]
# Empty includes every destination, subject to exclusions below.
destination_cidrs: []
# Exclude Pod and Service ranges. External services may use private addresses.
exclude_cidrs: ["10.244.0.0/16", "10.96.0.0/12", "127.0.0.0/8", "::1/128"]
object_path: build/egress.bpf.o
host_netns_path: /proc/1/ns/net
listen_addr: ":9359"
node: "" # NODE_NAME environment variable, then hostname
log_attempts: false
log:
  path: "" # empty = JSON lines to stdout; diagnostics are JSON on stderr
  max_size_mb: 100
  max_backups: 10
  max_age_days: 7
